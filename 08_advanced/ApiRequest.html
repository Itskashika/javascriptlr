<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: #212121; color:white;">
    <!-- 0	UNSENT	Client has been created. open() not called yet.<br>
1	OPENED	open() has been called.<br>
2	HEADERS_RECEIVED	send() has been called, and headers and status are available.<br>
3	LOADING	Downloading; responseText holds partial data.<br>
4	DONE	The operation is complete. -->

<div class="card">
      <img id="profileImage" src="https://via.placeholder.com/150" alt="Profile">
    <h2 id="username">Loading...</h2>
    <p id="followers"></p>
    <button>Follow</button>
</div>
</body>
<script>
      const requestUrl = 'https://api.github.com/users/Itskashika'
    const xhr= new XMLHttpRequest();

    xhr.open('GET',requestUrl);
   //tract at a time
   //  console.log(xhr.readyState);
   //continiousl track state change
   xhr.onreadystatechange=function(){
    console.log(xhr.readyState);
    if(xhr.readyState==4){
        const data=JSON.parse(this.responseText)
        console.log( data)
        document.getElementById("profileImage").src=data.avatar_url;

       document.getElementById("username").innerText=data.name;
       
document.getElementById("followers").innerText="Followers :"+data.followers;
    }
   }
    xhr.send();
    </script>
</html>
