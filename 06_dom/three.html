<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM learning Part 3</title>
</head>
<body style="background-color:#212121;color :whitesmoke">
    
</body>
<script>
    //create element
    const div=document.createElement('div')
    console.log(div)
    //add class and id
    div.className="main"
    div.id="myId"

    //custom attribute setting
    div.setAttribute("title","mytitle")
    div.style.backgroundColor="blue"
    //div.innerText="my own div"
    // add test to div then add div to body to display
    const addText=document.createTextNode("my own div from script")
    div.append(addText)
    document.body.append(div)

    
</script>
</html>
